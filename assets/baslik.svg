<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Muhammet Ali Rıza İçen — Bilişim Sistemleri ve Teknolojileri öğrencisi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.85" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#2aabee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2aabee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.05" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="340" rx="28"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .l1 { opacity: 0; animation: type 8s steps(1) infinite; animation-delay: 0.4s; }
      .l2 { opacity: 0; animation: type 8s steps(1) infinite; animation-delay: 1.2s; }
      .l3 { opacity: 0; animation: type 8s steps(1) infinite; animation-delay: 2.0s; }
      .l4 { opacity: 0; animation: type 8s steps(1) infinite; animation-delay: 2.8s; }
      @keyframes type { 0% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#g1)"/>
    <rect width="1280" height="340" fill="url(#g2)"/>

    <g class="sans">
      <text x="64" y="140" font-size="50" font-weight="800" fill="#f8fafc" letter-spacing="-1">Muhammet Ali Rıza İçen</text>
      <text x="64" y="190" font-size="17" fill="#cbd5e1">Bilişim Sistemleri ve Teknolojileri öğrencisi · Mehmet Akif Ersoy Üniversitesi</text>
      <text x="64" y="216" font-size="17" fill="#94a3b8">Gerçek bir sorunu çözen, gerçek kullanıcısı olan yazılımlar yapıyorum.</text>

      <g font-size="13" font-weight="600">
        <rect x="64" y="246" width="96" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="112" y="266" text-anchor="middle" fill="#e2e8f0">Python</text>
        <rect x="170" y="246" width="96" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="218" y="266" text-anchor="middle" fill="#e2e8f0">C# / .NET</text>
        <rect x="276" y="246" width="96" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="324" y="266" text-anchor="middle" fill="#e2e8f0">Docker</text>
        <rect x="382" y="246" width="96" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="430" y="266" text-anchor="middle" fill="#e2e8f0">Azure</text>
        <rect x="488" y="246" width="96" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="536" y="266" text-anchor="middle" fill="#e2e8f0">Linux</text>
      </g>
    </g>

    <!-- Terminal -->
    <g filter="url(#sh)">
      <rect x="760" y="56" width="456" height="236" rx="14" fill="#0d1117" stroke="#30363d"/>
      <rect x="760" y="56" width="456" height="36" rx="14" fill="#161b22"/>
      <rect x="760" y="78" width="456" height="14" fill="#161b22"/>
      <circle cx="784" cy="74" r="6" fill="#ff5f56"/>
      <circle cx="804" cy="74" r="6" fill="#ffbd2e"/>
      <circle cx="824" cy="74" r="6" fill="#27c93f"/>
      <text x="988" y="79" text-anchor="middle" class="sans" font-size="12" fill="#8b949e">ali@bucak: ~</text>
    </g>
    <g class="mono" font-size="14">
      <g class="l1">
        <text x="782" y="124" fill="#7ee787">$ <tspan fill="#e6edf3">whoami</tspan></text>
        <text x="782" y="146" fill="#a5d6ff">öğrenci · backend · bulut</text>
      </g>
      <g class="l2">
        <text x="782" y="176" fill="#7ee787">$ <tspan fill="#e6edf3">cat su_an.txt</tspan></text>
        <text x="782" y="198" fill="#ffa657">🥖 e-fatura botu → ilk canlı kesim</text>
      </g>
      <g class="l3">
        <text x="782" y="228" fill="#7ee787">$ <tspan fill="#e6edf3">docker ps --format "{{.Status}}"</tspan></text>
        <text x="782" y="250" fill="#56d364">Up 24/7 (healthy)</text>
      </g>
      <g class="l4">
        <text x="782" y="278" fill="#7ee787">$ <tspan class="blink" fill="#e6edf3">▌</tspan></text>
      </g>
    </g>
  </g>
</svg>
